[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "creditflow-api-gateway"
version = "1.0.0"
requires-python = ">=3.14"
dependencies = [
  "fastapi==0.116.1", "uvicorn[standard]==0.35.0", "pydantic==2.13.4",
  "pydantic-settings==2.12.0", "httpx==0.28.1", "redis==6.4.0",
  "aio-pika==9.5.7", "PyJWT[crypto]==2.10.1", "cryptography==45.0.6",
  "stripe==12.4.0", "orjson==3.11.2", "python-json-logger==3.3.0"
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py314"
line-length = 110
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC", "S", "SIM"]
ignore = ["S101"]

[tool.mypy]
python_version = "3.14"
strict = true
plugins = ["pydantic.mypy"]
mypy_path = "src"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--cov=api_gateway --cov-report=term-missing --cov-fail-under=80"
