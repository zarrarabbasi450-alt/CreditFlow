[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "creditflow-auth-service"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
  "fastapi==0.116.1", "uvicorn[standard]==0.35.0", "pydantic==2.13.4",
  "pydantic-settings==2.12.0", "sqlalchemy[asyncio]==2.0.43", "asyncpg==0.31.0",
  "alembic==1.16.5", "orjson==3.11.2", "python-json-logger==3.3.0",
  "argon2-cffi==25.1.0", "PyJWT[crypto]==2.10.1", "email-validator==2.3.0",
  "redis>=5.0.0", "aio-pika==9.5.7", "httpx==0.28.1"
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py314"
preview = true
line-length = 110
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC", "S", "SIM"]
ignore = ["S101"]

[tool.mypy]
python_version = "3.14"
strict = true
plugins = ["pydantic.mypy"]
mypy_path = "src"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-p no:cacheprovider --cov=auth_service --cov-report=term-missing --cov-fail-under=80"
filterwarnings = [
  "ignore:'asyncio.iscoroutinefunction' is deprecated.*:DeprecationWarning:fastapi.routing"
]
